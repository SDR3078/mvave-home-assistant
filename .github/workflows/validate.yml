# What Home Assistant and HACS check before they will accept an integration. Both are
# published as actions by the projects themselves, so this stays correct as their rules
# change rather than encoding a snapshot of them here.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because both actions check against a moving target: hassfest follows Home
    # Assistant's own release, and a manifest that was valid in March can stop being so.
    - cron: "0 4 * * 1"

# Both actions below are given a token by default. Neither needs to write anything, and
# this is what makes them running from a branch acceptable rather than alarming: pinning
# them to a commit would freeze the very rules they exist to track — see the note above —
# and `hacs/action` could not be pinned anyway, since its action.yml runs
# `docker://ghcr.io/hacs/action:main` whatever ref you ask for.
permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Nothing ignored. Two checks were, while the repository was private —
          # `hacsjson` and `integration_manifest` both read their file from
          # raw.githubusercontent.com unauthenticated and got a 404 — and the line
          # was deleted the day it went public (2026-09-14), so that every red here
          # is about this repository's contents and nothing else.
