# What Home Assistant and HACS check before they will accept an integration. Both are
# published as actions by the projects themselves, so this stays correct as their rules
# change rather than encoding a snapshot of them here.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because both actions check against a moving target: hassfest follows Home
    # Assistant's own release, and a manifest that was valid in March can stop being so.
    - cron: "0 4 * * 1"

# Both actions below are given a token by default. Neither needs to write anything, and
# this is what makes them running from a branch acceptable rather than alarming: pinning
# them to a commit would freeze the very rules they exist to track — see the note above —
# and `hacs/action` could not be pinned anyway, since its action.yml runs
# `docker://ghcr.io/hacs/action:main` whatever ref you ask for.
permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # DELETE THIS LINE WHEN THE REPOSITORY BECOMES PUBLIC.
          #
          # Neither check can pass while it is private, and neither is about this
          # repository's contents. Both read their file from
          # raw.githubusercontent.com, which is unauthenticated, so a private
          # repository answers 404 and HACS reports the file as missing or invalid:
          # `hacsjson` gets None back from get_hacs_json_raw and calls hacs.json
          # invalid, and `integration_manifest` finds manifest.json in the tree —
          # that part is the authenticated API and works — then cannot fetch it and
          # reports "expected a dictionary. Got None".
          #
          # Ignored rather than tolerated, so that a red Validate goes back to
          # meaning something: the one real failure left is `brands`, which wants a
          # 256x256 icon at custom_components/mvave/brand/icon.png, or this domain
          # listed at brands.home-assistant.io. That one is on docs/NEXT.md.
          ignore: hacsjson integration_manifest
