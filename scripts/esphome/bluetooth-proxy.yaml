# ESPHome config for the dev Bluetooth proxy: the ready-made "Generic ESP32" proxy from
# github.com/esphome/bluetooth-proxies (esp32-generic.yaml), with Wi-Fi from secrets.yaml
# so it can be built and pushed over the air from any machine with the ESPHome CLI:
#
#     uv venv .venv-esphome && uv pip install --python .venv-esphome/bin/python esphome
#     .venv-esphome/bin/esphome run scripts/esphome/bluetooth-proxy.yaml --device <ip>
#
# Or, in the ESPHome dashboard add-on, adopt the device and paste in the two components
# under "the part that matters" below. Either way the outcome is the same as flashing the
# "Generic ESP32" Bluetooth proxy from https://esphome.io/projects/?type=bluetooth.
#
# secrets.yaml (git-ignored) next to this file needs:
#     wifi_ssid: "..."
#     wifi_password: "..."

esphome:
  name: ble-midi-dev-proxy
  friendly_name: BLE MIDI dev proxy
  min_version: 2025.8.0

esp32:
  variant: esp32
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

logger:

# Open API on purpose: scripts/record_packets.py connects without a key. Add
# encryption (and pass --psk) once the proxy is adopted by Home Assistant.
api:

ota:
  - platform: esphome

# --- the part that matters -----------------------------------------------------------
esp32_ble_tracker:
  scan_parameters:
    # Defaults keep BLE and Wi-Fi coexisting; active scanning collects scan responses,
    # where some peripherals put their name and service UUIDs.
    active: true

bluetooth_proxy:
  active: true
# ---------------------------------------------------------------------------------------

button:
  - platform: safe_mode
    id: button_safe_mode
    name: Safe Mode Boot

  - platform: factory_reset
    id: factory_reset_btn
    name: Factory reset
